default_rule: deny_unlisted_sources

source_denylist:
  - pattern: https://github.com/zju3dv/PGSR/**
    exception: LICENSE.md may be accessed by the compliance reviewer only
  - pattern: any PGSR fork, mirror, diff, pull request, issue, discussion or source search snippet
  - pattern: diff-plane-rasterization and all forks or mirrors
  - pattern: diff-gaussian-rasterization and all forks or mirrors
  - pattern: original 3DGS rasterizer implementation and all source-derived summaries
  - pattern: Gaussian Wrapping target operators or source-derived summaries
  - pattern: gsplat or third-party reimplementations of the target operators
  - pattern: wheel, shared library, PTX, cubin, SASS, symbols or disassembly for a target implementation
  - pattern: kernel traces or intermediate target buffers used to infer implementation behavior
  - pattern: blogs, forums, Q-and-A snippets or LLM answers derived from target source
  - pattern: arXiv TeX source, paper figures and project-page media
  - pattern: local source checkouts, package caches, extension caches or remote environments containing denied code
  - pattern: the current full conversation history when launching the implementation agent

black_box_policy:
  default: disabled_without_explicit_rights_review
  normative_oracle: false
  implementation_agent_access: none
  if_authorized_later:
    - freeze inputs, metrics and tolerances before observing outputs
    - run by an isolated evaluator
    - observe only documented final-layer outputs
    - prohibit intermediate buffers, traces, disassembly and adaptive probing
    - store raw outputs outside the Apache repository in a restricted evidence store
    - return only aggregate pass-fail and categorized errors to maintainers

historical_non_normative_material:
  - id: splatatlasvol_raw_plane_depth_history
    description: Prior SplatAtlasVol render-only raw plane_depth preparation and records.
    validation_status: not_revalidated_in_this_effort
    permitted_use: maintainer background only
    prohibited_uses:
      - OpSpec semantics
      - reference implementation behavior
      - analytic fixture values
      - golden tensors
      - tolerance calibration
      - correctness oracle
      - RTX 4080 SUPER performance or memory baseline
      - implementation-agent packet
    staleness: may_be_outdated

current_source_exposure:
  status: planning_actor_not_eligible_as_clean_source_evidence
  actor: current_root_session
  date: "2026-09-12"
  observed:
    - official repository README and top-level file tree for project scope
    - official LICENSE.md
    - search results that inadvertently exposed a small number of target-source paths or identifiers
  not_observed_or_used:
    - target source file bodies
    - target CUDA implementation copied into this pack
    - target binaries, disassembly or kernel traces
  consequence:
    - this directory is planning material, not legal proof of independent implementation
    - final normative specs and references should be recreated or independently reviewed in fresh isolated contexts
    - the implementation agent must not inherit this conversation

patent_status: unreviewed
legal_note: This policy is engineering provenance guidance, not legal advice.
