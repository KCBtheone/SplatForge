schema_version: 1
policy_id: SF-PGSR-SOURCE-POLICY-DRAFT-1
status: planning_only
normative: false
accessed_at: "2026-09-12"

claim_language:
  allowed: source-controlled independent implementation from public mathematical descriptions
  forbidden:
    - certified clean-room implementation
    - source-compatible PGSR reimplementation
    - commercially licensed PGSR derivative

roles:
  spec_author:
    target_algorithm_documents: allow_explicit_entries_only
    target_implementation_sources: deny
    network: allowlist_only
  reference_author:
    target_algorithm_documents: local_original_spec_only
    target_implementation_sources: deny
    network: "off"
  implementation_agent:
    target_algorithm_documents: local_original_spec_only
    target_implementation_sources: deny
    network: "off"
  verification_agent:
    target_algorithm_documents: local_original_spec_only
    target_implementation_sources: deny
    network: "off"
  compliance_reviewer:
    target_algorithm_documents: metadata_and_license_only
    target_implementation_sources: deny
    network: allowlist_only

spec_author_allowlist:
  - id: pgsr_arxiv_abs_v2
    type: paper_metadata
    url: https://arxiv.org/abs/2406.06521v2
    version: arXiv:2406.06521v2
    purpose: authorship, version, DOI, abstract and license metadata
    redistribution_in_apache_repository: false
    content_digest: TO_BE_ARCHIVED_OUTSIDE_REPOSITORY_AND_PINNED
  - id: pgsr_arxiv_html_v2
    type: paper
    url: https://arxiv.org/html/2406.06521v2
    version: arXiv:2406.06521v2
    purpose: equations and method scope for independent contract derivation
    restrictions:
      - do not copy prose, figures, tables or page styling
      - do not follow code links
      - restate mathematics using original notation and SplatForge-owned semantics
    redistribution_in_apache_repository: false
    content_digest: TO_BE_ARCHIVED_OUTSIDE_REPOSITORY_AND_PINNED
  - id: pgsr_project_page
    type: official_project_page
    url: https://zju3dv.github.io/pgsr/
    version: snapshot_at_2026-09-12
    purpose: confirm author-stated high-level scope only
    restrictions:
      - do not copy or redistribute media
      - do not navigate to code
    redistribution_in_apache_repository: false
    content_digest: TO_BE_ARCHIVED_OUTSIDE_REPOSITORY_AND_PINNED
  - id: pgsr_software_license
    type: license
    url: https://github.com/zju3dv/PGSR/blob/main/LICENSE.md
    version: MUTABLE_MAIN_MUST_BE_REPLACED_BY_EXACT_COMMIT
    purpose: compliance review only
    redistribution_in_apache_repository: false
    content_digest: TO_BE_PINNED

