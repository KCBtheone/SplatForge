[build-system]
requires = ["setuptools>=69", "wheel", "torch>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-unbiased-gsplat"
version = "0.1.0.dev0"
description = "Source-isolated Unbiased Surfel auxiliary operators for Apache-2.0 gsplat"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
audit = ["packaging>=23"]
gsplat = [
  "gsplat @ git+https://github.com/nerfstudio-project/gsplat.git@6f378361f32ba4f1be86f65ae0db4948efb37dd5",
]
trainer = [
  "pycolmap @ git+https://github.com/rmbrualla/pycolmap.git@cc7ea4b7301720ac29287dbe450952511b32125e",
  "nerfview @ git+https://github.com/nerfstudio-project/nerfview.git@4538024fe0d15fd1a0e4d760f3695fc44ca72787",
  "viser==1.1.0",
  "scikit-learn==1.7.2",
  "torchmetrics[image]==1.9.0",
  "tyro==1.0.16",
  "splines==0.3.3",
  "piexif==1.1.3",
  "numpy==1.26.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["unbiased_gsplat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
